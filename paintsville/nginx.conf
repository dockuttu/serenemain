# nginx for serenemedspaky.com (static) — mounted into the paintsville-site container from serenemain/bundle/paintsville/nginx.conf.
# TLS is terminated by traefik in front of this container.
server {
    listen 80;
    server_name serenemedspaky.com www.serenemedspaky.com;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    server_tokens off;

    # www -> apex (traefik forwards the original Host)
    if ($host = "www.serenemedspaky.com") {
        return 301 https://serenemedspaky.com$request_uri;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml application/manifest+json;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    error_page 404 /404.html;
    location = /404.html { internal; }

    # clean URLs: /slug -> /slug/ (301), /slug/ -> /slug/index.html
    location / {
        try_files $uri $uri/ =404;
    }

    # long cache for fingerprinted/static assets
    location ~* \.(?:jpg|jpeg|png|webp|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }
    location ~* \.(?:css|js)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
    location ~* \.(?:xml|txt|webmanifest)$ {
        expires 1d;
    }
}
