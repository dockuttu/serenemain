server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # www -> apex (Traefik routes both hosts here)
    if ($host = "www.serenemedspas.com") { return 301 https://serenemedspas.com$request_uri; }

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css application/javascript text/javascript application/json application/xml text/xml text/plain image/svg+xml application/rss+xml font/woff2;

    error_page 404 /404.html;
    location = /404.html { internal; }

    # --- former WordPress/WooCommerce dynamic pages (retired) ---
    location ~ ^/(cart|checkout|my-account|login|logout|password-reset)(/|$) { return 301 /; }
    location ~ ^/shop(/|$) { return 301 https://barboursville.serenemedspas.com/shop/; }
    location ~ ^/blog(?:/(.*))?$ { return 301 https://blog.serenemedspas.com/$1; }
    location ~ ^/(wp-admin|wp-login\.php|xmlrpc\.php|wp-json|wp-cron\.php|feed)(/|$) { return 410; }
    location ~ \.php$ { return 410; }
    # WordPress search -> home
    if ($arg_s) { return 301 /; }

    # --- links that were already broken on the WordPress site (page deleted) -> nearest live page ---
    location = /xeomin-treatment-at-serene-med-spa-in-huntington-barboursville-wv/ { return 301 /wrinkle-treatments/; }
    location = /lip-filler-injection-in-huntington-barboursville-wv/ { return 301 https://barboursville.serenemedspas.com/lip-filler/; }
    location = /gallery/ { return 301 https://barboursville.serenemedspas.com/before-after/; }
    location ~ ^/(xperience-rewards|ultherapy|thread-lift|womens-sexual-wellness|spider-veins)/?$ { return 301 https://barboursville.serenemedspas.com/$1/; }
    location ~ ^/services/(prp|morpheus8|kybella)/?$ { return 301 https://barboursville.serenemedspas.com/; }

    location ~* \.(jpg|jpeg|png|webp|gif|ico|svg|woff|woff2|ttf|otf|eot|mp4|webm)$ { expires 30d; add_header Cache-Control "public"; }
    location ~* \.(css|js)$ { expires 7d; add_header Cache-Control "public"; }
    location / { try_files $uri $uri/ =404; }
}
