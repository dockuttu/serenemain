# cache lifetimes for the Barboursville tree (alias location; regex locations don't apply inside ^~)
# generated by gen_site.py: retired slugs and duplicate-slug articles -> 301 to the canonical URL
map $uri $moved_to {
    default "";
    include /usr/share/nginx/html/_redirects.map;
}
map $uri $bv_expires {
    default                                              off;
    ~*\.(jpg|jpeg|png|webp|gif|ico|svg|woff|woff2)$      30d;
    ~*\.(css|js)$                                        7d;
}
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # www -> apex (Traefik routes both hosts here)
    if ($host = "www.serenemedspas.com") { return 301 https://serenemedspas.com$request_uri; }

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css application/javascript text/javascript application/json application/xml text/xml text/plain image/svg+xml application/rss+xml font/woff2;

    error_page 404 /404.html;
    location = /404.html { internal; }
    location = /_redirects.map { return 404; }
    if ($moved_to) { return 301 $moved_to; }

    # --- former WordPress/WooCommerce dynamic pages (retired) ---
    location ~ ^/(cart|checkout|my-account|login|logout|password-reset)(/|$) { return 301 /; }
    location ~ ^/shop(/|$) { return 301 /barboursville/shop/; }
    location ~ ^/blog(?:/(.*))?$ { return 301 https://blog.serenemedspas.com/$1; }
    location ~ ^/(wp-admin|wp-login\.php|xmlrpc\.php|wp-json|wp-cron\.php|feed)(/|$) { return 410; }
    location ~ \.php$ { return 410; }
    # WordPress search -> home
    if ($arg_s) { return 301 /; }

    # --- redesign (Sep 2026): retired WordPress paths ---
    location ~ ^/20\d\d(/|$) { return 301 /blogs/; }                       # date archives
    location ~ ^/product(/|$) { return 301 /barboursville/shop/; }
    location = /team/ { return 301 /our-providers/; }
    location = /treatments/ { return 301 /service/; }
    location = /about/ { return 301 /about-us/; }
    location = /our-providers/robin-arora/ { return 301 /our-providers/robin-arora-md/; }
    location = /our-providers/stephanie-welker/ { return 301 /our-providers/stephanie-welker-fnp-bc/; }
    location ~ ^/locations/(locations|ormond-beach|visit-serene-med-spa-in-paintsville-ky)/?$ { return 301 /locations/; }
    location = /locations/huntington-barboursville-wv/ { return 301 /barboursville/; }
    location = /locations/visit-serene-med-spa-in-hudson-oh/ { return 301 /hudson/; }
    location ~ ^/(cosmetic-filler-injectable-treatment-serene-med-spas|juvederm-ultra-plus-filler-treatment|juvederm-ultra-xc-filler-treatment-serene-med-spas|top-filler-injection-treatments-serene-med-spas)/?$ { return 301 /barboursville/fillers/; }
    location = /juvederm-volbella-xc-treatment-lip-filler-under-eye/ { return 301 /barboursville/lip-filler/; }
    location ~ ^/wp-content/(plugins|themes)/ { return 410; }
    location ~ ^/wp-includes/ { return 410; }

    # --- links that were already broken on the WordPress site (page deleted) -> nearest live page ---
    location = /xeomin-treatment-at-serene-med-spa-in-huntington-barboursville-wv/ { return 301 /botox-treatment-benefits/; }
    location = /wrinkle-treatments/ { return 301 /hudson/botox/; }
    location = /botox-treatment-at-serene-med-spa-huntington-barboursville-wv/ { return 301 /botox-treatment-benefits/; }
    location = /lip-filler-injection-in-huntington-barboursville-wv/ { return 301 /lip-filler-injection/; }
    location = /spider-vein-treatment-in-huntington-barboursville-wv/ { return 301 /expert-spider-vein-treatment/; }
    location = /services/kybella/ { return 301 /kybella-treatment-for-double-chin/; }
    location = /services/morpheus8/ { return 301 /morpheus8-rf-microneedling-treatment-at-serene-med-spas/; }
    location = /services/prp/ { return 301 /microneedling-with-prp/; }
    location = /products/juvederm/voluma-xc/ { return 301 /juvederm-voluma-xc-midface-volume-treatment/; }
    location = /gallery/ { return 301 /barboursville/before-after/; }
    location ~ ^/(xperience-rewards|ultherapy|thread-lift|womens-sexual-wellness|spider-veins)/?$ { return 301 /barboursville/$1/; }

    # --- Barboursville office site, folded into this domain (Phase 2, Sep 2026). Built by /root/barboursville-src
    #     (v2_merge.py prefixes every URL), promoted to /root/barboursville/site and bind-mounted at /srv/barboursville.
    location = /barboursville { return 301 /barboursville/; }
    location ^~ /barboursville/ {
        alias /srv/barboursville/site/;
        try_files $uri $uri/ =404;
        expires $bv_expires;
        location ~ ^/barboursville/blog(?:/(.*))?$ { return 301 https://blog.serenemedspas.com/$1; }
    }

    # --- Hudson office site, folded into this domain (Phase 3, Sep 2026). Built by /root/hudson-src (v2_merge.py),
    #     promoted to /root/hudson/site and bind-mounted at /srv/hudson.
    location = /hudson { return 301 /hudson/; }
    location ^~ /hudson/ {
        alias /srv/hudson/site/;
        try_files $uri $uri/ =404;
        expires $bv_expires;
        add_header Access-Control-Allow-Origin "*";
        location ~ ^/hudson/blog(?:/(.*))?$ { return 301 https://blog.serenemedspas.com/$1; }
    }

    location ~* \.(jpg|jpeg|png|webp|gif|ico|svg|woff|woff2|ttf|otf|eot|mp4|webm)$ { expires 30d; add_header Cache-Control "public"; }
    location ~* \.(css|js)$ { expires 7d; add_header Cache-Control "public"; }
    location / { try_files $uri $uri/ =404; }
}
