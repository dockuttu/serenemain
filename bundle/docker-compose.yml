services:
  serenemain:
    image: nginx:alpine
    container_name: serenemain-site
    restart: always
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Barboursville office site (built by /root/barboursville-src, promoted to /root/barboursville/site)
      - /root/barboursville:/srv/barboursville:ro
      - /root/hudson:/srv/hudson:ro
    networks:
      - root_default
    labels:
      - "traefik.enable=true"
      # apex + www on one router; nginx 301s www -> apex
      - "traefik.http.routers.serenemain.rule=Host(`serenemedspas.com`) || Host(`www.serenemedspas.com`)"
      - "traefik.http.routers.serenemain.entrypoints=web,websecure"
      - "traefik.http.routers.serenemain.tls=true"
      - "traefik.http.routers.serenemain.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.serenemain.tls.domains[0].main=serenemedspas.com"
      - "traefik.http.routers.serenemain.tls.domains[0].sans=www.serenemedspas.com"
      - "traefik.http.services.serenemain.loadbalancer.server.port=80"
  # Lead relay (Nov 9 2026): website lead forms post to /api/lead; nginx above proxies here. Screens bots,
  # forwards real leads to Zoho with codes kept in leadrelay/config.json (never in the website HTML).
  leadrelay:
    image: python:3.12-alpine
    container_name: serene-leadrelay
    restart: always
    command: ["python", "-u", "/app/app.py"]
    volumes:
      - ./leadrelay:/app:ro
    environment:
      - PORT=8080
    networks:
      - root_default
  paintsville:
    image: nginx:alpine
    container_name: paintsville-site
    restart: always
    volumes:
      - ./paintsville/site:/usr/share/nginx/html:ro
      - ./paintsville/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - root_default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.paintsville.rule=Host(`serenemedspaky.com`) || Host(`www.serenemedspaky.com`)"
      - "traefik.http.routers.paintsville.entrypoints=web,websecure"
      - "traefik.http.routers.paintsville.tls=true"
      - "traefik.http.routers.paintsville.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.paintsville.tls.domains[0].main=serenemedspaky.com"
      - "traefik.http.routers.paintsville.tls.domains[0].sans=www.serenemedspaky.com"
      - "traefik.http.services.paintsville.loadbalancer.server.port=80"
networks:
  root_default:
    external: true
